services:
  aicareer-mysql:
    image: mysql:8.0
    container_name: aicareer-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: aicareer_db
    ports:
      - "3308:3306"
    volumes:
      - aicareer_mysql_data:/var/lib/mysql

volumes:
  aicareer_mysql_data:
