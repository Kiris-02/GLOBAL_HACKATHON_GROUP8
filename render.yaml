services:
  # Spring Boot Backend Service
  - type: web
    name: aicareer-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: DATABASE_URL
        fromDatabase:
          name: aicareer-db
          property: connectionString

  # React Vite Frontend Static Site
  - type: web
    name: aicareer-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: singapore
    routes:
      - type: rewrite
        source: /api/*
        destination: https://aicareer-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://aicareer-backend.onrender.com/api

databases:
  - name: aicareer-db
    databaseName: aicareer_db
    user: aicareer_user
    plan: free
    region: singapore
